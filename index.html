<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f7fb">
  <title>Asistente educativo</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #17263a;
      background: #f4f7fb;
      --panel: #fff;
      --muted: #4d5f75;
      --border: #dbe4ee;
      --blue: #1655a5;
      --blue-dark: #104283;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    [hidden] { display: none !important; }
    button, textarea { font: inherit; }

    .header { background: var(--panel); border-bottom: 1px solid var(--border); }
    .wrap { width: min(46rem, calc(100% - 2rem)); margin-inline: auto; }
    .brand { display: flex; align-items: center; gap: .75rem; min-height: 4.5rem; font-weight: 700; }
    .brand-icon { display: grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: .65rem; background: #e8f1fd; color: var(--blue); }
    main { padding-block: clamp(2rem, 7vw, 4rem); }
    h1 { margin: 0 0 .55rem; font-size: clamp(1.8rem, 5vw, 2.5rem); line-height: 1.15; letter-spacing: -.035em; }
    h2 { margin: 0 0 .7rem; font-size: 1.15rem; }
    h3 { margin: 0 0 .45rem; font-size: .95rem; }
    p { margin: 0; line-height: 1.6; }
    .intro { max-width: 39rem; color: var(--muted); }
    .card { margin-top: 1.4rem; padding: clamp(1rem, 4vw, 1.6rem); border: 1px solid var(--border); border-radius: 1rem; background: var(--panel); box-shadow: 0 .35rem 1.2rem #17263a08; }
    label { display: block; margin-bottom: .55rem; font-weight: 650; }
    textarea { display: block; width: 100%; min-height: 7rem; padding: .8rem .9rem; border: 1px solid #9fb0c3; border-radius: .65rem; color: inherit; background: #fff; line-height: 1.5; resize: vertical; }
    textarea::placeholder { color: #576b80; }
    :focus-visible { outline: 3px solid #2b78db; outline-offset: 3px; }
    .actions { display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-top: .9rem; }
    .hint { color: var(--muted); font-size: .875rem; }
    button { padding: .65rem 1rem; min-height: 2.75rem; border: 0; border-radius: .6rem; background: var(--blue); color: #fff; font-weight: 650; cursor: pointer; }
    button:hover { background: var(--blue-dark); }
    button:disabled { background: #576b80; cursor: wait; }
    .status { margin-top: 1rem; color: var(--muted); }
    .status:empty { margin-top: 0; }
    .status.error { color: #9b2929; }
    .answer { white-space: pre-wrap; overflow-wrap: anywhere; }
    .references { margin-top: 1.1rem; padding-top: .95rem; border-top: 1px solid var(--border); }
    .references ol { margin: 0; padding-inline-start: 1.6rem; }
    .references li { margin-block: .35rem; overflow-wrap: anywhere; }
    .references a { color: var(--blue-dark); text-underline-offset: .18em; }

    @media (max-width: 31rem) {
      .actions { align-items: stretch; flex-direction: column; }
      .actions button { align-self: flex-start; }
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="wrap brand">
      <span class="brand-icon" aria-hidden="true">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 4h11a2 2 0 0 1 2 2v14H7a2 2 0 0 1-2-2V4Z"/><path d="M5 17a2 2 0 0 1 2-2h11M9 8h5m-5 3h5"/>
        </svg>
      </span>
      <span>Biblioteca de consulta</span>
    </div>
  </header>

  <main class="wrap">
    <h1>Asistente educativo</h1>
    <p class="intro">Consulta los documentos de la biblioteca y revisa las fuentes de cada respuesta.</p>

    <form class="card" id="consulta">
      <label for="pregunta">¿Qué quieres consultar?</label>
      <textarea id="pregunta" name="pregunta" maxlength="1500" required aria-describedby="aviso" placeholder="Ejemplo: ¿Cómo se justifican las inasistencias?"></textarea>
      <div class="actions">
        <p class="hint" id="aviso">Evita ingresar nombres, RUT u otros datos personales.</p>
        <button id="enviar" type="submit">Consultar</button>
      </div>
    </form>

    <p class="status" id="estado" role="status"></p>
    <section class="card" id="resultado" hidden aria-labelledby="titulo-respuesta">
      <h2 id="titulo-respuesta" tabindex="-1">Respuesta</h2>
      <p class="answer" id="respuesta"></p>
      <div class="references" id="referencias" hidden>
        <h3>Fuentes consultadas</h3>
        <ol id="fuentes"></ol>
      </div>
    </section>
  </main>

  <script>
    const API_URL = 'https://script.google.com/a/macros/educangol.cl/s/AKfycbzSteumzC6DG1ivzlfQEigXw1e648oS7MxFSK9lS5BuzVzK0BcCga6vOF0MDl3XfJKqLQ/exec';

    const formulario = document.querySelector('#consulta');
    const entrada = document.querySelector('#pregunta');
    const enviar = document.querySelector('#enviar');
    const estado = document.querySelector('#estado');
    const resultado = document.querySelector('#resultado');
    const tituloRespuesta = document.querySelector('#titulo-respuesta');
    const respuesta = document.querySelector('#respuesta');
    const referencias = document.querySelector('#referencias');
    const listaFuentes = document.querySelector('#fuentes');

    formulario.addEventListener('submit', async evento => {
      evento.preventDefault();
      const pregunta = entrada.value.trim();
      resultado.hidden = true;

      if (!pregunta) {
        mostrarEstado('Escribe una pregunta para continuar.', true);
        entrada.focus();
        return;
      }

      if (!/^https:\/\/script\.google\.com\/.+\/exec(?:\?.*)?$/.test(API_URL)) {
        mostrarEstado('Falta configurar la URL de Google Apps Script en index.html.', true);
        return;
      }

      enviar.disabled = true;
      mostrarEstado('Consultando los documentos…');

      try {
        const peticion = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify({ pregunta }),
          signal: AbortSignal.timeout(60000)
        });
        if (!peticion.ok) throw new Error('El servicio devolvió HTTP ' + peticion.status + '.');

        const datos = await peticion.json();
        if (datos.error) {
          mostrarEstado(datos.error, true);
          return;
        }
        if (typeof datos.respuesta !== 'string') throw new Error('Respuesta inesperada.');

        respuesta.textContent = datos.respuesta;
        mostrarFuentes(Array.isArray(datos.fuentes) ? datos.fuentes : []);
        resultado.hidden = false;
        mostrarEstado('');
        tituloRespuesta.focus();
      } catch (error) {
        mostrarEstado(error.name === 'TimeoutError'
          ? 'La consulta tardó demasiado. Intenta nuevamente.'
          : 'No se pudo conectar. Revisa la URL /exec y el acceso de la implementación.', true);
      } finally {
        enviar.disabled = false;
      }
    });

    function mostrarEstado(mensaje, esError = false) {
      estado.textContent = mensaje;
      estado.classList.toggle('error', esError);
    }

    function mostrarFuentes(fuentes) {
      listaFuentes.replaceChildren();

      for (const fuente of fuentes) {
        const elemento = document.createElement('li');
        elemento.value = fuente.id;
        if (/^https:\/\/(docs|drive)\.google\.com\//.test(fuente.url)) {
          const enlace = document.createElement('a');
          enlace.href = fuente.url;
          enlace.textContent = fuente.titulo;
          elemento.append(enlace);
        } else {
          elemento.textContent = fuente.titulo;
        }
        listaFuentes.append(elemento);
      }

      referencias.hidden = !listaFuentes.children.length;
    }
  </script>
</body>
</html>
